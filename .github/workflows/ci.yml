name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright's Chromium install does not support the newest ubuntu-latest image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE" --to "$HEAD"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:examples
      # The browser checks run in the `a11y` job, so this job installs no Chromium.
      - run: pnpm test:unit
      - run: pnpm test:pack

  # The browser checks: every test file that drives Chromium (scripts/test.ts picks them), then the accessibility gate (internal spec,
  # lede-lang/meta), every shipped page through axe-core at four settings. Beside `test`, so the two halves run at once; it needs no
  # commitlint history. CI (and LEDE_REQUIRE_CHROME for the gate) makes a missing Chromium a failure, not a skip.
  a11y:
    # Pinned: Playwright's Chromium install does not support the newest ubuntu-latest image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached on bench/package.json, which pins playwright-core and so the build; the system libraries it
      # needs are installed on every run. The checks find it in the Playwright cache (bench/src/shot.ts), so CHROME is not set.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('bench/package.json') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter ./bench exec playwright-core install chromium
      - name: Install Chromium's system libraries
        run: pnpm --filter ./bench exec playwright-core install-deps chromium
      # The gate is not in `pnpm test`; naming it here runs it beside the browser files.
      - name: Browser checks and the accessibility gate
        run: LEDE_REQUIRE_CHROME=1 pnpm test:browser test/a11y.test.ts
