name: pages

# Publishes every shipped example, built by this commit's CLI, to GitHub Pages (scripts/build-pages.ts), so the site shows what
# `lede build` does on main without waiting for npm. Needs Settings, Pages, Source set to "GitHub Actions" once; until then the
# deploy job fails and nothing else is affected.

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'packages/core/src/**'
      - 'packages/render-html/src/**'
      - 'packages/cli/src/**'
      - 'scripts/build-pages.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:examples
      - run: node scripts/build-pages.ts _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # The only job with a token that can write: it runs no repository code.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
