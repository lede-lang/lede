name: release

# Stages @lede-lang/core, @lede-lang/html and @lede-lang/cli on npm, with provenance (D48, D61).
#
# Started by the GitHub release that changelog.yml publishes for every version (D60), or by hand, and only from a public repository.
# Nothing is published before the public repository exists (D45), and npm provenance needs a public repository anyway; in a private
# one both jobs are skipped. Two manual checks stand between a commit and the registry (D58, D61): the build job tests and packs on
# its own and writes what it packed to the run summary; the publish job waits for a reviewer to approve the `npm` environment and
# then runs `npm stage publish`, which uploads the tarballs without making them public. A maintainer then approves each staged
# version on npmjs.com (Staged Packages tab) or with `npm stage approve <stage-id>`, with 2FA. Core and html first, then cli.
# A tag push does not start it: the release commit says [skip ci], and GitHub applies that to the push of a tag on that commit too.
#
# Authentication is npm trusted publishing (OIDC): each package on npmjs.com names this repository, this file
# (release.yml) and the `npm` environment. npm configures a trusted publisher on a package that already exists, so the
# very first stage uses an NPM_TOKEN secret on the `npm` environment instead; delete the secret once trusted
# publishing is set up. Staging a package that does not exist makes npm publish a public placeholder, 0.0.0-stage.
#
# The build job tests and packs; the publish job, the only one with an OIDC token, stages those tarballs.
# Versions move in lockstep: pnpm pins `workspace:*` to the exact version, and test:pack fails if the three differ.
# A version already on npm is skipped, so a run that failed halfway can be rerun. A version already staged is not detected:
# reject the older stage with `npm stage reject <stage-id>` before rerunning.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that runs repository and dependency code happens here, without an OIDC token or the npm secret.
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Anyone with write access can publish a release for any tag, and tags have no ruleset: only a tag that is on main and names
      # the version in the packages is staged.
      - name: Require a release tag on main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="$(node -p "require('./packages/cli/package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but the packages are at $version"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:examples
      - run: pnpm test
      - run: pnpm test:pack
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node scripts/pack.ts "$RUNNER_TEMP/release" > "$RUNNER_TEMP/release/packed.tsv"
      # What the reviewer checks before approving the `npm` environment: the exact tarballs the publish job will upload.
      - name: Summarise what is staged
        run: |
          {
            echo "## Staged for npm: v$(node -p "require('./packages/cli/package.json').version")"
            echo
            echo "Started from \`$GITHUB_REF_NAME\` ($GITHUB_EVENT_NAME). Commit \`$GITHUB_SHA\`. Approve the \`npm\` environment on this run to stage these tarballs on npm; reject it to stage nothing. Staged versions are public only after a maintainer approves them on npm with 2FA."
            echo
            echo "| Package | On npm | Files | Bytes | sha256 |"
            echo "| --- | --- | --- | --- | --- |"
            while IFS=$'\t' read -r spec file; do
              tgz="$RUNNER_TEMP/release/$(basename "$file")"
              if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then onnpm='yes (skipped)'; else onnpm='no (will publish)'; fi
              echo "| \`$spec\` | $onnpm | $(tar -tzf "$tgz" | wc -l | tr -d ' ') | $(wc -c < "$tgz" | tr -d ' ') | \`$(shasum -a 256 "$tgz" | cut -c1-16)\` |"
            done < "$RUNNER_TEMP/release/packed.tsv"
            while IFS=$'\t' read -r spec file; do
              echo
              echo "<details><summary>Files in <code>$spec</code></summary>"
              echo
              echo '```'
              tar -tzf "$RUNNER_TEMP/release/$(basename "$file")"
              echo '```'
              echo "</details>"
            done < "$RUNNER_TEMP/release/packed.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # Stages the tarballs the build job tested; no checkout, no install, no repository code. npm makes nothing public until a
  # maintainer approves each staged version with 2FA.
  publish:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # OIDC for trusted publishing and the provenance attestation
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # `npm stage` needs npm 11.15.0 or later, which Node 24 does not bundle. Pinned like the actions.
      - name: Install npm
        run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: release
      - name: Stage
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) throw new Error(`npm ${process.argv[1]} is older than 11.15.0, which npm stage needs`);
          ' "$(npm --version)"
          # Bootstrap only. npm reads the token from the environment; with none set it authenticates through OIDC.
          if [ -n "$NPM_TOKEN" ]; then echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"; fi
          if [ ! -s release/packed.tsv ]; then echo '::error::release/packed.tsv lists no packages'; exit 1; fi
          while IFS=$'\t' read -r spec file; do
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already on npm; skipped"
              continue
            fi
            # The ./ matters: npm reads a bare "release/x.tgz" as the GitHub repository release/x.tgz.
            npm stage publish "./release/$(basename "$file")" --access public --provenance
          done < release/packed.tsv
          # What the maintainer approves next, with the stage ids npm assigned.
          {
            echo "## Staged on npm"
            echo
            echo "Nothing is public yet. Approve each version with 2FA, core and html before cli: on npmjs.com, Staged Packages tab, or \`npm stage approve <stage-id>\`."
            while IFS=$'\t' read -r spec file; do
              echo
              echo "\`${spec%@*}\`"
              echo '```'
              npm stage list "${spec%@*}" 2>&1 || echo "npm stage list failed"
              echo '```'
            done < release/packed.tsv
          } >> "$GITHUB_STEP_SUMMARY"
