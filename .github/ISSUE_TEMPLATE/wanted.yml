name: I wanted to write X and could not
description: A page or a piece of one that Lede would not let you write, or that came out wrong.
labels: [wanted]
body:
  - type: textarea
    id: making
    attributes:
      label: What you were making
      description: The page, or the brief a model was given.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: The Lede you tried, or wished you could write
      description: The smallest source that shows it, with the diagnostics from `lede check` if there were any.
      render: text
    validations:
      required: true
  - type: textarea
    id: instead
    attributes:
      label: What you did instead
      description: A workaround, a plainer page, raw HTML, or giving up.
  - type: input
    id: writer
    attributes:
      label: Which agent and model wrote it
      description: For example the agent or host, and the model name. Write "me" if you wrote it by hand.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`lede --version`, or the commit if you run from a checkout."
    validations:
      required: true
